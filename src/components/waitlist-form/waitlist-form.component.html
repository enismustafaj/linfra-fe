<div class="waitlist-form">
    <form nz-form>
        <nz-form-item>
            <nz-form-label [nzSpan]="26" nzFor="email">name</nz-form-label>
            <nz-form-control [nzSpan]="26">
                <input nz-input placeholder="Enter your fullname..." name="email" type="email"
                       id="name"/>
            </nz-form-control>
        </nz-form-item>

        <nz-form-item>
            <nz-form-label [nzSpan]="26" nzFor="email">e-mail</nz-form-label>
            <nz-form-control [nzSpan]="26">
                <input nz-input placeholder="Enter your email..." name="email" type="email"
                       id="email"/>
            </nz-form-control>
        </nz-form-item>
    </form>

    <button nz-button nzType="primary">Join the waitlist</button>
</div>
