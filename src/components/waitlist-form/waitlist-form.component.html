<div class="waitlist-form">
    <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()">
        <nz-form-item>
            <nz-form-label nzFor="name" nzRequired>name</nz-form-label>
            <nz-form-control>
                <input nz-input formControlName="name" placeholder="Enter your fullname..."
                       name="name" type="text"
                       id="name"/>
            </nz-form-control>
        </nz-form-item>

        <nz-form-item>
            <nz-form-label nzFor="email" nzRequired>email</nz-form-label>
            <nz-form-control>
                <input nz-input formControlName="email" placeholder="Enter your email..."
                       name="email" type="email"
                       id="email"/>
            </nz-form-control>
        </nz-form-item>

        <button nz-button class="waitlist-form__button" nzType="primary" type="submit" [disabled]="!!(submission$ | async)">Join the
            waitlist
        </button>
    </form>


    <div class="waitlist-form__success" *ngIf="!!(submission$ | async)">
        <nz-card>
            <span nz-icon nzType="check-circle" nzTheme="twotone" nzTwotoneColor="#52c41a"></span>
            <span>
                Thank you for your interest {{ (firstName$ | async) }}!
                Keep an eye on your mailbox for more updates.
        </span>
        </nz-card>

    </div>
</div>
