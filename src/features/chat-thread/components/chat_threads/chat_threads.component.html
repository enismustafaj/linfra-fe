<div class="resource-threads">
    <h2>Resource Threads</h2>

    <app-resource-overview></app-resource-overview>

    <div class="resource-threads-container">
        <diV class="chat-threads">
            <ng-container *ngIf="chatThreads | async as chatThreads; else loading">
                @for (thread of chatThreads; track $index) {
                    @if (edittingThread == thread.chatThreadId) {
                        <div class="chat-thread-edit">
                            <nz-input-group [nzSuffix]="actions">
                                <input type="text" nz-input placeholder="input search text" [value]="thread.chatThreadName" />
                            </nz-input-group>

                            <ng-template #actions>
                                <button nz-button nzType="default" nzSize="small" (click)="saveThread(thread.chatThreadId)">
                                    <i nz-icon nzType="check"></i>
                                </button>
                                <button nz-button nzType="default" nzSize="small" (click)="cancelEdit()">
                                    <i nz-icon nzType="close"></i>
                                </button>
                            </ng-template>
                        </div>
                    } @else {
                        <div class="chat-thread-static">
                            <div (click)="selectChatThread(thread)">{{thread.chatThreadName}}</div>
                            <div class="thread-actions">
                                <button nz-button nzType="default" nzSize="small" (click)="editThread(thread.chatThreadId)">
                                    <i nz-icon nzType="edit"></i>
                                </button>
                            </div>
                        </div>
                    } 
                }
            </ng-container>

            <ng-template #loading>
                <p>Loading chat threads...</p>
            </ng-template>

            <div class="add-chat-thread">
                <button nz-button nzType="primary" class="add-chat-thread-btn" nzShape="circle" (click)="createThread()">
                    <i nz-icon nzType="plus"></i>
                </button>
            </div>
        </diV>

        <div class="resource-chat">
            <app-resource-thread></app-resource-thread>
        </div>
    </div>

</div>
