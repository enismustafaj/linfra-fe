<div class="resource-threads">

    <h2>Resource Threads</h2>

    <app-resource-overview></app-resource-overview>

    <div class="resource-threads-container">
        <diV class="chat-threads">

            <ng-container *ngIf="chatThreads | async as chatThreads; else loading">
                @for (thread of chatThreads; track $index) {
                    <div class="chat-thread" (click)="selectChatThread(thread)">
                        <div>{{thread.chatThreadName}}</div>
                    </div>
                }
            </ng-container>

            <ng-template #loading>
                <p>Loading chat threads...</p>
            </ng-template>

            <div class="add-chat-thread">
                <button nz-button nzType="primary" class="add-chat-thread-btn" nzShape="circle" (click)="showModal()">
                    <i nz-icon nzType="plus"></i>
                </button>
            </div>

            <nz-modal [(nzVisible)]="isVisible" nzTitle="Create new resource chat" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
                <ng-container *nzModalContent>
                    <nz-form-item>
                        <nz-form-label [nzSpan]="6">Chat Thread Name</nz-form-label>
                        <nz-form-control [nzSpan]="14" style="margin-left: 5px;">
                            <input nz-input [(ngModel)]="chatThreadName" />
                        </nz-form-control>
                    </nz-form-item>
                </ng-container>
              </nz-modal>
        </diV>

        <div class="resource-chat">
            <app-resource-thread></app-resource-thread>
        </div>
    </div>

</div>
