<div>
    <nz-collapse>
        <nz-collapse-panel [nzHeader]="resourceName" [nzActive]="false" [nzDisabled]="false">
            <nz-list nzBordered>
                @for (item of resourceProperties; track item) {
                  <nz-list-item>
                    {{ item.name }} : {{ item.value }}
                  </nz-list-item>
                }
              </nz-list>
        </nz-collapse-panel>
    </nz-collapse>
</div>
