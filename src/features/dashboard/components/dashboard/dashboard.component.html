
<div class="dashboard">
    <h2 class="dashboard-title">My Resources</h2>

    <div class="dashboard-content">
    
        <div class="resources-container" *ngIf="resources$ | async as resources; else loading">
            @for (resource of resources.resources; track resource) {
                <div class="resource-container">
                    <app-resource [resourceName]="resource.name" [resourceProperties]="resource.properties"></app-resource>
                </div>
            }
            
        </div>

        <ng-template #loading>
            <p>Loading your resources...</p>
        </ng-template>

        <div>
            <button nz-button nzType="primary" class="add-resource-btn" nzShape="circle">
                <i nz-icon nzType="plus"></i>
            </button>
        </div>
        
    </div> 

    
</div>
